name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: Show the library version used for the build
        run: go list -m github.com/burn-lab-dev/cantcp-lib-go
      - name: Build the binaries (amd64, arm64, armv7)
        run: make cross
      - name: Build the .deb packages (amd64, arm64, armhf)
        run: make deb VERSION=${{ github.ref_name }}
      - name: Collect the release archives
        run: |
          for target in amd64 arm64 armv7; do
            tar -C bin -czf "dist/cantcpd-linux-$target.tar.gz" "cantcpd-linux-$target"
            tar -C bin -czf "dist/cantcp-cli-linux-$target.tar.gz" "cantcp-cli-linux-$target"
          done
      - name: Checksums
        run: (cd dist && sha256sum ./*.deb ./*.tar.gz > checksums.txt && cat checksums.txt)
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes dist/*
          fi

  apt:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download the .deb assets of the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --pattern '*.deb' --dir debs --repo "$GITHUB_REPOSITORY"
      - name: Install the repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils gnupg
      - name: Build the APT repository
        env:
          APT_GPG_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: scripts/apt-repo.sh debs repo stable
      - name: Publish to GitHub Pages (gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: repo
          publish_branch: gh-pages

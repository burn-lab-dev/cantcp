name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.24.x", "1.25.x", "1.26.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: go test -race
        run: go test -race ./...

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: Enable vcan0
        run: |
          if ! sudo modprobe vcan 2>/dev/null; then
            # Some runners (for example Azure kernels) ship the module in the
            # extra package.
            sudo apt-get update
            sudo apt-get install -y "linux-modules-extra-$(uname -r)" || true
          fi
          if sudo modprobe vcan; then
            sudo ip link add dev vcan0 type vcan
            # MTU 72 enables CAN FD on the virtual bus.
            sudo ip link set vcan0 mtu 72
            sudo ip link set up vcan0
            echo "VCAN_OK=1" >> "$GITHUB_ENV"
            echo "vcan0 is up: the socketcan and e2e tests will run"
          else
            echo "::warning::vcan is not available on this runner; the socketcan and e2e tests will be skipped"
          fi
      - name: go test -race with vcan0 (socketcan and end-to-end tests)
        # The socketcan and e2e packages share vcan0: run the packages
        # sequentially so the tests do not see each other's frames.
        run: go test -race -p 1 ./...
      - name: Smoke test on vcan
        if: env.VCAN_OK == '1'
        run: scripts/vcan-smoke.sh --report artifacts
      - name: Upload the smoke report
        if: ${{ always() && env.VCAN_OK == '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: vcan-smoke-report
          path: artifacts/
      - name: Publish the smoke report to the job summary
        if: ${{ always() && env.VCAN_OK == '1' }}
        run: cat artifacts/report.md >> "$GITHUB_STEP_SUMMARY"

  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: Cross build (linux/amd64, linux/arm64, linux/armv7)
        run: make cross
      - name: Build the .deb packages
        run: make deb VERSION=v0.0.0

  canon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: Download the codec module
        run: go mod download github.com/burn-lab-dev/cantcp-lib-go
      - name: Compare the codec vectors with the canon
        run: |
          module_dir=$(go list -m -f '{{.Dir}}' github.com/burn-lab-dev/cantcp-lib-go)
          expected=$(curl -fsSL https://raw.githubusercontent.com/burn-lab-dev/cantcp-spec/main/vectors.sha256 | cut -d' ' -f1)
          actual=$(sha256sum "$module_dir/testdata/vectors.json" | cut -d' ' -f1)
          echo "canon: $expected"
          echo "codec: $actual"
          test "$expected" = "$actual"

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  fuzz:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: Fuzz the candump parser
        run: go test -run='^$' -fuzz='^FuzzParseFrameLine$' -fuzztime=2m ./cmd/cantcp-cli/
